name: Tablet layout
on:
  push:
    paths:
      - '.github/workflows/tablet.yml'
      - 'app/src/**'
      - 'app/build.gradle.kts'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tablet-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tablet:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          log-accepted-android-sdk-licenses: false
      - name: Install build SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Build the app and tablet tests
        run: ./gradlew --no-daemon --max-workers=1 :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Tablet 16 to 10 on Android 15
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          ram-size: 3072M
          heap-size: 512M
          disk-size: 8192M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb shell wm size 2560x1600
            adb shell wm density 320
            adb shell settings put system accelerometer_rotation 0
            adb shell settings put system user_rotation 0
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            mkdir -p app/build/reports/tablet-device
            adb shell wm size > app/build/reports/tablet-device/display-size.txt
            adb shell wm density > app/build/reports/tablet-device/display-density.txt
            adb shell am instrument -w -r -e class cz.jenda.wowforever.TabletLayoutDeviceTest cz.jenda.wowforever.guide.test/androidx.test.runner.AndroidJUnitRunner > app/build/reports/tablet-device/instrumentation.txt
            cat app/build/reports/tablet-device/instrumentation.txt
            adb pull /sdcard/Android/data/cz.jenda.wowforever.guide/files/tablet-qa app/build/reports/tablet-device/screenshots
            python3 -c 'from pathlib import Path; s=Path("app/build/reports/tablet-device/instrumentation.txt").read_text(); assert "OK (3 tests)" in s and "FAILURES" not in s, s'
      - name: Upload tablet evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tablet-device-${{ github.sha }}
          path: app/build/reports/tablet-device/
          if-no-files-found: warn
          retention-days: 14
