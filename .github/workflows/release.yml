name: Signed Android pilot
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: android-pilot
    env:
      FOREVER_SIGNING_PASSWORD: ${{ secrets.FOREVER_SIGNING_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Restore owner key outside the checkout
        env:
          FOREVER_SIGNING_STORE_B64: ${{ secrets.FOREVER_SIGNING_STORE_B64 }}
        run: |
          python3 - <<'PY'
          import base64,os
          from pathlib import Path
          value=os.environ.get('FOREVER_SIGNING_STORE_B64','')
          if not value or not os.environ.get('FOREVER_SIGNING_PASSWORD'):raise SystemExit('Missing protected owner signing secrets')
          target=Path(os.environ['RUNNER_TEMP'])/'forever-owner.jks'
          target.write_bytes(base64.b64decode(value,validate=True));target.chmod(0o600)
          with open(os.environ['GITHUB_ENV'],'a') as env:
              env.write('FOREVER_SIGNING_STORE='+str(target)+'\n')
          PY
      - name: Install pinned SDK and content tools
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
          python3 -m pip install -r tools/requirements.txt
      - name: Verify data and release preconditions
        run: |
          python3 tools/validate_content.py
          python3 tools/verify_assets.py
          python3 tools/verify_e10_data.py
          python3 tools/verify_e10b_data.py
          python3 tools/verify_e10c_data.py
          python3 tools/verify_bundled.py
          python3 -m unittest discover -s tools -p 'test_*.py'
          ./gradlew --no-daemon --max-workers=1 :app:checkReleasePrerequisites
      - name: Build, tests and lint
        run: ./gradlew --no-daemon --max-workers=1 clean :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest :app:testDebugUnitTest :app:lintDebug :app:lintRelease
      - name: Bind APK to source and package artifacts
        run: |
          mkdir -p dist/pilot
          cp app/build/outputs/apk/release/app-release.apk dist/pilot/WoW_Forever_0.16.0-audit.apk
          python3 tools/verify_release.py --apk dist/pilot/WoW_Forever_0.16.0-audit.apk --aapt "$ANDROID_HOME/build-tools/35.0.0/aapt" --apksigner "$ANDROID_HOME/build-tools/35.0.0/apksigner" --output dist/pilot/WoW_Forever_0.16.0-audit_release.json
          python3 tools/package_sources.py --apk dist/pilot/WoW_Forever_0.16.0-audit.apk --output dist/pilot/WoW_Forever_0.16.0-audit_zdroje.zip
          cp docs/E10_AUDIT.md dist/pilot/WoW_Forever_0.16.0-audit_navod.md
      - name: Upload owner-signed pilot artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: forever-0.16.0-audit-pilot-${{ github.sha }}
          path: dist/pilot/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Remove temporary key
        if: always()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          (Path(os.environ['RUNNER_TEMP'])/'forever-owner.jks').unlink(missing_ok=True)
          PY
