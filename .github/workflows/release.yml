name: Signed Android pilot
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: android-pilot
    env:
      FOREVER_SIGNING_PASSWORD: ${{ secrets.FOREVER_SIGNING_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Restore owner key outside the checkout
        env:
          FOREVER_SIGNING_STORE_B64: ${{ secrets.FOREVER_SIGNING_STORE_B64 }}
        run: |
          python3 - <<'PY'
          import base64,os
          from pathlib import Path
          value=os.environ.get('FOREVER_SIGNING_STORE_B64','')
          if not value or not os.environ.get('FOREVER_SIGNING_PASSWORD'):raise SystemExit('Missing protected owner signing secrets')
          target=Path(os.environ['RUNNER_TEMP'])/'forever-owner.jks'
          target.write_bytes(base64.b64decode(value,validate=True));target.chmod(0o600)
          with open(os.environ['GITHUB_ENV'],'a') as env:
              env.write('FOREVER_SIGNING_STORE='+str(target)+'\n')
          PY
      - name: Set up Android SDK tools
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          log-accepted-android-sdk-licenses: false
      - name: Install pinned SDK and content tools
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
          python3 -m pip install -r tools/requirements.txt
      - name: Verify data and release preconditions
        run: |
          python3 tools/validate_content.py
          python3 tools/verify_assets.py
          python3 tools/verify_e10_data.py
          python3 tools/verify_e10b_data.py
          python3 tools/verify_e10c_data.py
          python3 tools/verify_bundled.py
          python3 -m unittest discover -s tools -p 'test_*.py'
          ./gradlew --no-daemon --max-workers=1 :app:checkReleasePrerequisites
      - name: Build, tests and lint
        run: ./gradlew --no-daemon --max-workers=1 clean :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest :app:testDebugUnitTest :app:lintDebug :app:lintRelease
      - name: Bind APK to source and package artifacts
        run: |
          mkdir -p dist/pilot
          cp app/build/outputs/apk/release/app-release.apk dist/pilot/WoW_Forever_0.17.0-ui1.apk
          python3 tools/verify_release.py --apk dist/pilot/WoW_Forever_0.17.0-ui1.apk --aapt "$ANDROID_HOME/build-tools/35.0.0/aapt" --apksigner "$ANDROID_HOME/build-tools/35.0.0/apksigner" --output dist/pilot/WoW_Forever_0.17.0-ui1_release.json
          python3 tools/package_sources.py --apk dist/pilot/WoW_Forever_0.17.0-ui1.apk --output dist/pilot/WoW_Forever_0.17.0-ui1_zdroje.zip
          cp docs/E10_AUDIT.md dist/pilot/WoW_Forever_0.17.0-ui1_navod.md
      - name: Upload owner-signed pilot artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: forever-0.17.0-ui1-pilot-${{ github.sha }}
          path: dist/pilot/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Remove temporary key
        if: always()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          (Path(os.environ['RUNNER_TEMP'])/'forever-owner.jks').unlink(missing_ok=True)
          PY
