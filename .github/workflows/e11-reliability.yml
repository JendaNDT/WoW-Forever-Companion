name: E11 reliability
on:
  push:
    paths:
      - '.github/workflows/e11-reliability.yml'
      - 'app/src/**'
      - 'tools/e11_ci_device.py'
      - 'tools/test_e11_ci_device.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: e11-${{ github.ref }}
  cancel-in-progress: true
jobs:
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api: [26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          log-accepted-android-sdk-licenses: false
      - name: Install build SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Build the app and reliability tests
        run: ./gradlew --no-daemon --max-workers=1 :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Full-content reliability on Android ${{ matrix.api }}
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          ram-size: 2048M
          heap-size: 512M
          disk-size: 8192M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: python3 tools/e11_ci_device.py --serial emulator-5554 --output app/build/reports/e11-device-${{ matrix.api }} --soak-seconds 1200
      - name: Upload reliability evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e11-device-${{ matrix.api }}-${{ github.sha }}
          path: app/build/reports/
          if-no-files-found: warn
          retention-days: 14
