name: Android checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install pinned Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - name: Validate fallback and E10 data
        run: |
          python3 -m pip install -r tools/requirements.txt
          python3 tools/content_schema.py
          python3 tools/validate_content.py
          python3 tools/verify_assets.py
          python3 tools/verify_e10_data.py
          python3 tools/verify_e10b_data.py
          python3 tools/verify_e10c_data.py
          python3 tools/verify_bundled.py
          python3 -m unittest discover -s tools -p "test_*.py"
      - name: Build, unit tests and lint
        run: ./gradlew --no-daemon --max-workers=1 :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest :app:lintDebug :app:lintRelease
      - name: Verify APK identity and all bundled assets
        run: |
          python3 tools/verify_debug_apk.py --apk app/build/outputs/apk/debug/app-debug.apk --aapt "$ANDROID_HOME/build-tools/35.0.0/aapt" --apksigner "$ANDROID_HOME/build-tools/35.0.0/apksigner" --output app/build/reports/debug-apk-verification.json
          sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/app-debug.apk.sha256
      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Warlock-Forever-0.16.0-audit-debug-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
            app/build/reports/debug-apk-verification.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-reports-${{ github.sha }}
          path: |
            app/build/test-results/
            app/build/reports/
          retention-days: 14
